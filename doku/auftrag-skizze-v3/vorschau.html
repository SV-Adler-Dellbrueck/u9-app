<!doctype html><html lang="de"><meta charset="utf-8"><title>Skizze v3 – Sollbild Schritte</title>
<style>body{font-family:system-ui,sans-serif;background:#f1f5f9;margin:0;padding:16px;color:#0f172a}
h1{font-size:16px;margin:0 0 4px}p{font-size:12px;color:#475569;margin:0 0 12px}
.reihe{display:flex;gap:12px;flex-wrap:wrap}.bild{width:280px}.bild b{display:block;font-size:12px;margin-bottom:4px}
svg{margin:0!important}</style>
<h1>Skizze v3 – Sollbild: „Dreieckspassen mit Abschluss“ in vier Bildern</h1>
<p>Gezeichnet mit dem heutigen Renderer <code>_skz</code>. Aufbau (Zone, Hütchen, Schusszone, Tor) kommt aus der Grundbeschreibung, Spieler, Ball, Pfeile und Text aus dem jeweiligen Bild. Genau so soll <code>_skz(spec, n)</code> arbeiten.</p>
<div class="reihe" id="reihe"></div>
<script src="../../data.js"></script>
<script>
fetch("beispiel-schritte.json").then(r=>r.json()).then(({skizze})=>{
  const {schritte,...basis}=skizze;
  const bilder=[basis].concat((schritte||[]).map(s=>Object.assign({},basis,s)));
  document.getElementById("reihe").innerHTML=bilder.map((sp,i)=>`<div class="bild"><b>Bild ${i+1}</b>${_skz(sp)}</div>`).join("")+`<div class="bild"><b>Legende</b>${skzLegende()}</div>`;
});
</script>
