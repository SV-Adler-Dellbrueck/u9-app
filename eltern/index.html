<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- Eigener Ordner = eigener Manifest-Scope (/eltern/). Nur so erkennt Chrome den
     Eltern-Bereich als zweite, unabhaengige App neben der Trainer-App. -->
<base href="../">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="U9 Eltern">
<meta name="application-name" content="U9 Eltern">
<link rel="manifest" id="pwa-manifest" href="manifest-eltern.json">
<link rel="apple-touch-icon" id="apple-icon" href="icon-eltern.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eltern-Bereich – SV Adler Dellbrück U9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css">
<script>
(function(){
  // start_url ist "./eltern/" (ohne Query). boot.js erkennt den Eltern-Bereich aber an
  // ?portal – also ergaenzen wir es, bevor irgendein Skript location.search liest.
  // ABSOLUTER Pfad: relative URLs wuerden gegen <base href="../"> aufgeloest und die
  // Seite aus ihrem eigenen Scope /eltern/ heraus in die Wurzel schieben.
  if(!location.search){ try{ history.replaceState({},"",location.pathname+"?portal"); }catch(e){} }
  // Nur-Lese-Ansichten und das Kinder-Quiz bieten keine Installation an.
  var p=new URLSearchParams(location.search);
  if(p.has("quiz")||p.has("heft")||p.has("ticker")||p.has("kind")||p.has("delegate")||p.has("match")){
    document.getElementById("pwa-manifest").remove();
  }
})();
</script>
</head>
<body>
<script>
/* Seitengeruest aus shell.html nachladen, dann die Skripte in genau der Reihenfolge
   wie frueher im <body>. Die Skripte haengen sich an DOMContentLoaded – das ist beim
   Nachladen laengst vorbei, deshalb loesen wir es am Ende einmal selbst aus. */
window.addEventListener("error",function(e){try{var d=document.getElementById("pin-diag");if(d&&!d.dataset.err&&d.textContent.indexOf("Bereit")!==0){d.dataset.err="1";d.style.color="#fecaca";d.textContent="⚠️ "+(e.message||"Skript-Fehler")+" – "+String(e.filename||"").split("/").pop()+":"+(e.lineno||"?");}}catch(_){}},true);
window.addEventListener("unhandledrejection",function(e){try{var m=String((e.reason&&e.reason.message)||e.reason||"");if(/Transition was aborted|AbortError|abort/i.test(m))return;var d=document.getElementById("pin-diag");if(d&&!d.dataset.err&&d.textContent.indexOf("Bereit")!==0){d.dataset.err="1";d.style.color="#fecaca";d.textContent="⚠️ "+(m||"Fehler").slice(0,120);}}catch(_){}});
window.pinNext=window.pinNext||function(el,n){if(el&&el.value.length===1){var x=document.getElementById("pin"+n);if(x)x.focus();}};
window.pinBack=window.pinBack||function(){};window.pinCheck=window.pinCheck||function(){};
(async function(){
  const shell=await (await fetch("shell.html")).text();
  document.body.insertAdjacentHTML("afterbegin",shell);
  // Haengt die Ladung (alter/kaputter Cache), bekommt der Nutzer nach 16 s einen
  // Reparatur-Knopf: Service Worker + Caches wegraeumen und frisch laden.
  setTimeout(function(){
    var d=document.getElementById("pin-diag");
    if(d&&d.textContent.indexOf("App lädt")===0&&!d.dataset.err){
      d.innerHTML='⚠️ Die App lädt nicht fertig. <button id="pin-repair" style="margin-left:6px;padding:6px 12px;border:none;border-radius:8px;background:#fff;color:#1e3a8a;font-weight:800;cursor:pointer;font-family:inherit">🔧 App reparieren</button>';
      document.getElementById("pin-repair").onclick=async function(){
        this.textContent="Repariere…";
        try{
          if(navigator.serviceWorker){var rs=await navigator.serviceWorker.getRegistrations();for(var i=0;i<rs.length;i++)await rs[i].unregister();}
          if(window.caches){var ks=await caches.keys();for(var j=0;j<ks.length;j++)await caches.delete(ks[j]);}
        }catch(e){}
        location.reload();
      };
    }
  },16000);

  const ALLE=["data.js","core.js","engine.js","views.js","quiz.js",
    "md-eltern-portal.js","md-abzeichen.js","md-carpool.js","md-fanfakten.js","md-teamkasse.js","md-kabine.js",
    "md-aufstellung.js","md-print.js","md-taktikboard.js","md-taktik-draw.js","md-taktik-video.js","md-kalender.js","md-gegner.js","md-turnierplan.js",
    "md-teams.js","md-matchuhr.js","md-liveticker.js","md-spielbericht.js",
    "md-matchcard.js","md-analyse.js","md-quests.js","md-voice.js","md-wissen.js","md-fazit.js",
    "md-live-vollbild.js","md-fundbuero.js","md-taktik-bib.js","md-ausruestung.js","md-galerie.js","md-kasse.js","md-ki-coach.js",
    "boot.js"];
  /* Der Eltern-Hub brauchte bisher ALLE 35 Dateien (1,9 MB) - inklusive Turnierverwaltung,
     Taktikboard und KI-Coach, die Eltern nie sehen. Fuer den Dashboard-Fall laedt jetzt
     erst der Kern (Welle 1), der Rest kommt danach im Hintergrund.
     WICHTIG: Sonderrouten (Quiz, Ticker, Heft, Turnier, Handover ...) laden weiterhin
     alles in EINER Welle - dort haengen Module am sofortigen Start und ein falscher
     Schnitt wuerde sie zerstoeren. */
  const _p=new URLSearchParams(location.search);
  const SONDER=["quiz","ticker","heft","turnier","handover","kind","delegate","match","eltern"];
  const istDashboard=!SONDER.some(k=>_p.has(k));
  const KERN=["data.js","core.js","engine.js","views.js","md-eltern-portal.js","md-kasse.js",
    "md-kabine.js","md-kalender.js","md-galerie.js","md-carpool.js","md-fanfakten.js",
    "md-abzeichen.js","md-fundbuero.js","boot.js"];
  /* Modul-Selbstpruefung: ein SyntaxError in einer Datei laesst den script-onerror
     KALT - der Loader meldet "fertig", waehrend die Datei nie ausgefuehrt wurde
     (so blieb md-gegner.js zehn Versionen lang tot). Darum nach Welle 2 je Modul
     einen Namen abfragen, der ganz unten in der Datei steht. Fehlt er, ist die
     Datei unterwegs gestorben. */
  const MODUL_WACHE={"md-abzeichen.js":"abzeichenAward","md-analyse.js":"atActionsFor","md-aufstellung.js":"kombiShareLineup","md-ausruestung.js":"ausruestungGridRender","md-carpool.js":"elternCarpoolPatch","md-eltern-portal.js":"tdVorberichtLoad","md-fanfakten.js":"elternFotoUpload","md-fazit.js":"fazitModulDa","md-fundbuero.js":"fundbueroDelete","md-galerie.js":"galerieDelete","md-gegner.js":"turnierRender","md-kabine.js":"renderTrainerUI","md-kalender.js":"gegnerAddrPick","md-kasse.js":"elternTickerLoad","md-einheit-import.js":"bibliothekAbgleich","md-ki-coach.js":"kiCoachSaveForm","md-live-vollbild.js":"teamBackupDownload","md-liveticker.js":"tickerDelete","md-matchcard.js":"rotReset","md-matchuhr.js":"mcSetHalbzeiten","md-print.js":"_printNow","md-quests.js":"questSave","md-skizze.js":"tfSkizzeOpen","md-spielbericht.js":"kindRsvp","md-taktik-bib.js":"ttDelete","md-taktik-draw.js":"dwClear","md-taktik-video.js":"tbAddDrag","md-taktikboard.js":"taktikRender","md-teamkasse.js":"kasseDelUmlage","md-teams.js":"nomApplyToTools","md-turnierplan.js":"_htMonRender","md-voice.js":"atPick","md-wissen.js":"wissenAuf","quiz.js":"kidsIntroClose"};
  function modulWache(geladen){
    const kaputt=geladen.filter(d=>MODUL_WACHE[d]&&typeof window[MODUL_WACHE[d]]!=="function");
    if(!kaputt.length)return;
    console.error("Modul-Wache: geladen, aber nicht ausgefuehrt:",kaputt);
    const w=document.createElement("div");
    w.setAttribute("role","alert");
    w.style.cssText="position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:#7f1d1d;color:#fff;border-radius:12px;padding:10px 14px;font:600 12px/1.4 system-ui;box-shadow:0 4px 16px rgba(0,0,0,.35)";
    w.innerHTML='\u26a0\ufe0f Teile der App sind nicht gestartet ('+kaputt.length+'). Bitte neu laden \u2013 wenn es bleibt, dem Entwickler melden: '+kaputt.join(", ")+
      ' <button onclick="this.parentElement.remove()" style="float:right;min-height:28px;padding:2px 10px;border:none;border-radius:8px;background:#fff;color:#7f1d1d;font-weight:800">OK</button>';
    document.body.appendChild(w);
  }
  const lade=(liste)=>new Promise((fertig,fehler)=>{
    if(!liste.length){fertig();return;}
    let offen=liste.length;
    liste.forEach(datei=>{
      const sc=document.createElement("script");
      sc.src=datei; sc.async=false;              // parallel laden, in Reihenfolge ausfuehren
      sc.onload=()=>{ if(--offen===0)fertig(); };
      sc.onerror=()=>fehler(new Error(datei));
      document.body.appendChild(sc);
    });
  });
  if(istDashboard){
    await lade(KERN);
    const welle2=ALLE.filter(f=>KERN.indexOf(f)<0);
    lade(welle2).then(()=>modulWache(welle2.concat(KERN))).catch(e=>console.error("Welle 2:",e));
  }else{
    await lade(ALLE);
    modulWache(ALLE);
  }
  if(document.readyState!=="loading")document.dispatchEvent(new Event("DOMContentLoaded"));
})().catch(e=>{
  console.error(e);
  document.body.innerHTML='<div style="font-family:system-ui;padding:32px;text-align:center;color:#334155">'
    +'<div style="font-size:40px">🦅</div><p>Der Eltern-Bereich konnte nicht geladen werden.<br>Bitte die Seite neu laden.</p></div>';
});
</script>
</body>
</html>
