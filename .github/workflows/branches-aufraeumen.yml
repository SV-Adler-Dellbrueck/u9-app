# Räumt Branches auf, deren Pull Request gemergt ist (Squash-Merges inklusive).
# Von Hand starten: Actions → „Branches aufräumen“ → „Run workflow“.
# Erst mit trocken = true (Standard): listet nur, was gelöscht würde. Dann mit trocken = false löschen.
#
# Gelöscht wird ein Branch nur, wenn ALLES stimmt:
#   · es gibt einen gemergten Pull Request mit diesem Branch als Quelle,
#   · es gibt keinen offenen Pull Request mit diesem Branch,
#   · der letzte Commit des Branches ist nicht jünger als der Merge (nach dem Merge wurde nichts mehr daraufgepusht),
#   · er heißt nicht main, gh-pages oder wie der Standardzweig.
# Alles andere bleibt stehen und wird gemeldet.
name: Branches aufräumen
on:
  workflow_dispatch:
    inputs:
      trocken:
        description: "Nur auflisten, nichts löschen (true/false)"
        required: true
        default: "true"
permissions:
  contents: write
  pull-requests: read
jobs:
  aufraeumen:
    runs-on: ubuntu-latest
    steps:
      - name: Branches prüfen und löschen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TROCKEN: ${{ github.event.inputs.trocken }}
          STANDARD: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls?state=all&per_page=100" \
            --jq '.[] | [.head.ref, .state, (.merged_at // ""), (.head.repo.full_name // "")] | @tsv' > prs.tsv
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' > branches.txt
          geloescht=0; bleibt=0
          while read -r b; do
            [ -z "$b" ] && continue
            case "$b" in "$STANDARD"|main|gh-pages) continue;; esac
            gem=$(awk -F'\t' -v b="$b" -v r="$REPO" '$1==b && $3!="" && $4==r {print $3}' prs.tsv | sort | tail -1)
            offen=$(awk -F'\t' -v b="$b" -v r="$REPO" '$1==b && $2=="open" && $4==r' prs.tsv | wc -l)
            if [ -z "$gem" ]; then echo "BLEIBT   $b – kein gemergter PR"; bleibt=$((bleibt+1)); continue; fi
            if [ "$offen" -gt 0 ]; then echo "BLEIBT   $b – offener PR"; bleibt=$((bleibt+1)); continue; fi
            tip=$(gh api "repos/$REPO/commits/$(printf %s "$b" | jq -sRr @uri)" --jq '.commit.committer.date')
            if [ "$(date -d "$tip" +%s)" -gt "$(( $(date -d "$gem" +%s) + 120 ))" ]; then
              echo "BLEIBT   $b – nach dem Merge weitergepusht ($tip > $gem)"; bleibt=$((bleibt+1)); continue
            fi
            if [ "$TROCKEN" = "true" ]; then echo "WÜRDE LÖSCHEN $b"; else
              gh api -X DELETE "repos/$REPO/git/refs/heads/$b" && echo "GELÖSCHT $b"; fi
            geloescht=$((geloescht+1))
          done < branches.txt
          echo "---"; echo "löschbar/gelöscht: $geloescht · bleibt: $bleibt · trocken: $TROCKEN"
